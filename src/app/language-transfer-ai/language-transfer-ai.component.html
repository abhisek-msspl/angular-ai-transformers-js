<div
  class="min-h-screen bg-gradient-to-br from-blue-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4"
>
  <div
    class="bg-white bg-opacity-10 backdrop-blur-lg shadow-xl p-8 rounded-2xl max-w-4xl w-full text-white animate-fade-in"
  >
    <h1 class="text-3xl font-bold mb-6 text-center">🌐 Language Transfer AI</h1>

    @if (loading$ | async) {
    <div class="loading mb-6">
      <p class="text-center">
        Loading translation model... {{ progress$ | async }}
      </p>
    </div>
    }

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <!-- Source Language Selection -->
      <div>
        <label class="block text-sm font-semibold mb-2">Source Language</label>
        <select
          [(ngModel)]="sourceLanguage"
          class="w-full p-3 rounded-lg bg-white bg-opacity-20 text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
          @for (lang of languageOptions; track lang.value) {
          <option [value]="lang.label" class="bg-gray-800">
            {{ lang.label }}
          </option>
          }
        </select>
      </div>

      <!-- Target Language Selection -->
      <div>
        <label class="block text-sm font-semibold mb-2">Target Language</label>
        <select
          [(ngModel)]="targetLanguage"
          class="w-full p-3 rounded-lg bg-white bg-opacity-20 text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
          @for (lang of languageOptions; track lang.value) {
          <option [value]="lang.label" class="bg-gray-800">
            {{ lang.label }}
          </option>
          }
        </select>
      </div>
    </div>

    <!-- Swap Languages Button -->
    <div class="flex justify-center mb-6">
      <button
        (click)="swapLanguages()"
        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold transition duration-200 flex items-center gap-2"
        title="Swap languages"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
          />
        </svg>
        Swap Languages
      </button>
    </div>

    <!-- Source Text Input -->
    <div class="mb-4">
      <label class="block text-sm font-semibold mb-2">
        Enter text in {{ sourceLanguage() }}
      </label>
      <textarea
        [(ngModel)]="sourceText"
        placeholder="Type or paste your text here..."
        class="w-full h-32 p-4 rounded-lg bg-white bg-opacity-20 text-white placeholder-white placeholder-opacity-70 focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"
      ></textarea>
    </div>

    <!-- Translate Button -->
    <button
      (click)="translate()"
      [disabled]="loading() || !sourceText()"
      class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 disabled:cursor-not-allowed rounded-lg font-semibold transition duration-200 mb-4"
    >
      {{ loading() ? "Translating..." : "Translate" }}
    </button>

    @if (loading()) {
    <div class="flex justify-center my-4">
      <div
        class="loader ease-linear rounded-full border-4 border-t-4 border-white h-8 w-8"
      ></div>
    </div>
    }

    <!-- Translated Text Output -->
    @if (translatedText() && !loading()) {
    <div class="mt-6">
      <label class="block text-sm font-semibold mb-2">
        Translation in {{ targetLanguage() }}
      </label>
      <div
        class="bg-black bg-opacity-30 p-4 rounded-lg whitespace-pre-wrap min-h-[100px] border border-white border-opacity-20"
      >
        {{ translatedText() }}
      </div>
    </div>
    }
  </div>
</div>
